name: Deploy EventRadar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eventradar-production
  cancel-in-progress: false
jobs:
  deploy:
    # Set only after server bootstrap and secrets. Initial pushes cannot deploy.
    if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy source on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BOT_ENV: ${{ secrets.BOT_ENV }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          for setting in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing GitHub secret $setting in the production environment"
              exit 1
            fi
          done
          key_file="$RUNNER_TEMP/eventradar-ssh-key"
          hosts_file="$RUNNER_TEMP/eventradar-known-hosts"
          env_file="$RUNNER_TEMP/eventradar-env"
          trap 'rm -f "$key_file" "$hosts_file" "$env_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$hosts_file"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          ssh_options=(-i "$key_file" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts_file" -o ConnectTimeout=20)
          if [[ -n "$BOT_ENV" ]]; then
            printf '%s\n' "$BOT_ENV" > "$env_file"
            ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" \
              'umask 077; cat > /srv/eventradar/.env.pending' < "$env_file"
          fi
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$RELEASE_SHA" < infra/deploy.sh
