name: eventradar
services:
  bot:
    image: eventradar:${RELEASE_TAG:-local}
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,mode=1777]
    volumes:
      - data:/data
      - ./runtime/chatgpt:/data/chatgpt
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, python, -m, eventradar.health]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
volumes:
  data:
