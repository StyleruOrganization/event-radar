[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "eventradar"
version = "0.1.0"
description = "Private Telegram channel digests and event invitations"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic-settings>=2.10,<3",
  "telethon>=1.45,<2",
  "tzdata>=2025.2",
]

[tool.setuptools.packages.find]
include = ["eventradar*"]

[tool.setuptools.package-data]
eventradar = ["schema.sql"]
